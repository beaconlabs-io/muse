name: Deploy Worker

# Deploys are merge-driven, not push-driven: only a merged PR into dev/main
# ships. A direct push to those branches deploys nothing — use the manual
# dispatch below if you ever need to ship something that did not arrive via PR.
on:
  pull_request:
    types: [closed]
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy the selected branch to
        type: choice
        options: [staging, production]
        required: true

concurrency:
  group: deploy-worker-${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.event.pull_request.base.ref == 'main' && 'production' || 'staging') }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # Closing a PR without merging also fires `closed`, so every job is gated on
  # the merge actually having happened.
  resolve:
    name: Resolve target
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.pick.outputs.environment }}
      ref: ${{ steps.pick.outputs.ref }}
      # This job joins no GitHub Environment, so `vars.*` here resolves to the
      # repository-level (staging) value — captured for the deploy job, whose
      # own view of the variable is shadowed by its environment's override.
      repo_api_base_url: ${{ steps.pick.outputs.repo_api_base_url }}
    env:
      # GitHub withholds secrets from pull_request runs of fork PRs — including
      # the `closed` event that fires on merge. `secrets` cannot be read from an
      # `if:`, so it is mapped to a flag here. (Checking the secret rather than
      # `head.repo.fork` also covers a deleted fork, where `head.repo` is null,
      # and a repository where the secret was never configured.)
      HAS_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      # Without this, a merged fork PR would pass ~10 minutes of lint/test/build
      # and only then fail at the deploy step with an empty token, leaving the
      # environment silently stale behind a red run. Fail fast and loudly.
      - name: Refuse to run without a Cloudflare token
        if: env.HAS_CLOUDFLARE_TOKEN != 'true'
        run: |
          echo "::error::CLOUDFLARE_API_TOKEN is not available to this run (fork-originated PR, or the secret is not configured), so nothing can deploy. Ship this merge manually: Actions → Deploy Worker → 'Run workflow' from the merged branch."
          exit 1

      - id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_ENV: ${{ inputs.environment }}
          DISPATCH_REF: ${{ github.ref_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          REPO_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            environment="$DISPATCH_ENV"
            ref="$DISPATCH_REF"
          elif [ "$BASE_REF" = "main" ]; then
            environment=production
            ref=main
          else
            environment=staging
            ref=dev
          fi
          {
            echo "environment=$environment"
            echo "ref=$ref"
            echo "repo_api_base_url=$REPO_API_BASE_URL"
          } >> "$GITHUB_OUTPUT"
          echo "Deploying branch '$ref' to '$environment'"

  deploy:
    name: Deploy ${{ needs.resolve.outputs.environment }}
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: write
    # GitHub Environments are used here for deployment history, the current URL
    # on the repo sidebar, and the production-only variable overrides described
    # below — not for approvals. A merged PR ships straight through by design;
    # the PR review is the gate.
    environment:
      name: ${{ needs.resolve.outputs.environment }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      # husky's `prepare` script has no hooks to install on a CI checkout.
      HUSKY: "0"
      # Every value this app reads at runtime is a NEXT_PUBLIC_* string inlined
      # into the bundle by `next build`, so the environment split happens here,
      # at build time, not in wrangler.jsonc. Repository-level variables carry
      # the staging values; the `production` GitHub Environment overrides them.
      # The checks below catch a missing production override — `NEXT_PUBLIC_ENV`
      # by expected value, `NEXT_PUBLIC_API_BASE_URL` by comparison against the
      # repository-level value — instead of shipping staging config to prod.
      NEXT_PUBLIC_ENV: ${{ vars.NEXT_PUBLIC_ENV }}
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
      NEXT_PUBLIC_EXTERNAL_SEARCH_ENABLED: ${{ vars.NEXT_PUBLIC_EXTERNAL_SEARCH_ENABLED }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - run: bun install --frozen-lockfile

      # The checks a PR passes, re-run against the merged branch so nothing
      # reaches an environment without passing them. The build is not repeated:
      # `build:worker` below is the same `next build`, against the code that
      # actually ships.
      - run: bun run lint:check

      - run: bun run test:run

      # An unset NEXT_PUBLIC_* does not fail the build — it inlines an empty
      # string and produces a Worker that renders but calls same-origin routes
      # this app no longer serves. Fail here instead, where the cause is legible.
      - name: Check build variables
        env:
          TARGET_ENV: ${{ needs.resolve.outputs.environment }}
          REPO_API_BASE_URL: ${{ needs.resolve.outputs.repo_api_base_url }}
        run: |
          missing=()
          for name in NEXT_PUBLIC_ENV NEXT_PUBLIC_API_BASE_URL; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing GitHub variables for '${TARGET_ENV}': ${missing[*]}. Set them as repository variables (staging values) or in the '${TARGET_ENV}' environment."
            exit 1
          fi

          # lib/constants.ts switches the canonical base URL on this value, so
          # it must differ between the two environments.
          case "$TARGET_ENV" in
            production) expected=production ;;
            *) expected=development ;;
          esac
          if [ "$NEXT_PUBLIC_ENV" != "$expected" ]; then
            echo "::error::NEXT_PUBLIC_ENV is '${NEXT_PUBLIC_ENV}' but a ${TARGET_ENV} deploy expects '${expected}'. The '${TARGET_ENV}' environment is probably missing its variable overrides."
            exit 1
          fi

          # The backend URL must differ too, and NEXT_PUBLIC_ENV cannot vouch
          # for it: with the NEXT_PUBLIC_API_BASE_URL override missing, the
          # presence loop above still passes on the repository-level staging
          # value, and the smoke test below never checks which backend the
          # bundle calls. So on a production deploy, compare the resolved value
          # against the repository-level one captured by the `resolve` job —
          # equality means the 'production' environment override is missing or
          # was deleted.
          if [ "$TARGET_ENV" = "production" ] && [ "$NEXT_PUBLIC_API_BASE_URL" = "$REPO_API_BASE_URL" ]; then
            echo "::error::NEXT_PUBLIC_API_BASE_URL resolves to the repository-level (staging) value on a production deploy. Set the production backend URL as an override in the 'production' environment."
            exit 1
          fi

      - name: Build Worker
        id: build
        run: |
          bun run build:worker

          # Prerendered pages land in .open-next/cache/<BUILD_ID>/, not in the
          # assets directory, and only `opennextjs-cloudflare deploy` uploads
          # them. Pick one to smoke-test with, read from the build output rather
          # than hardcoded, so it cannot rot when the evidence package changes.
          page=$(find .open-next/cache -path '*/en/evidence/*.cache' -print -quit 2>/dev/null) || true
          if [ -z "$page" ]; then
            echo "::error::No prerendered evidence page in .open-next/cache — generateStaticParams produced nothing, so the smoke test below cannot verify the cache upload."
            exit 1
          fi
          slug=$(basename "$page" .cache)
          echo "evidence_slug=$slug" >> "$GITHUB_OUTPUT"
          echo "Smoke test will use evidence slug '$slug'"

      # Deploying through `opennextjs-cloudflare`, not `wrangler deploy`, is
      # load-bearing: only this path uploads the prerendered pages into the
      # static assets cache. A plain `wrangler deploy` leaves every evidence
      # page 404ing while the rest of the site looks healthy.
      - name: Deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TARGET_ENV: ${{ needs.resolve.outputs.environment }}
          # wrangler appends machine-readable NDJSON records here — the `deploy`
          # record's `targets` carries the deployed URLs — which survives banner
          # rewording and extra hosts in the CLI output, unlike scraping the
          # log. The variable passes through to the wrangler child process that
          # opennextjs-cloudflare spawns.
          WRANGLER_OUTPUT_FILE_DIRECTORY: ${{ runner.temp }}/wrangler-output
        run: |
          bunx opennextjs-cloudflare deploy -e "$TARGET_ENV"

          records=$(cat "$WRANGLER_OUTPUT_FILE_DIRECTORY"/*.json 2>/dev/null) || records=""
          url=$(jq -r 'select(.type == "deploy") | .targets[0]? // empty' <<< "$records" | tail -1) || url=""
          if [ -z "$url" ]; then
            echo "::error::The deploy succeeded but wrangler reported no target URL, so the smoke test cannot run. Verify the deployment manually."
            exit 1
          fi
          # Reduce whichever shape wrangler reported to a bare origin. A
          # workers.dev target arrives as a full URL; a custom-domain target
          # arrives as a hostname wrangler annotates in place —
          # "muse.beaconlabs.io (custom domain)" — and the annotation has to go,
          # or every curl below dies on a malformed URL (#300).
          host=${url#*://}
          host=${host%%/*}
          host=${host%% *}
          url="https://${host}"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"

      - name: Smoke test
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          EVIDENCE_SLUG: ${{ steps.build.outputs.evidence_slug }}
        run: |
          # A freshly deployed workers.dev URL can 404 for tens of seconds, so
          # every request retries before the deploy is called bad.
          fetch() {
            curl --fail --silent --show-error --location \
              --retry 10 --retry-delay 6 --retry-all-errors \
              --output "$2" "$1"
          }

          # `/` exercises the locale redirects that replaced the next-intl proxy.
          echo "GET ${DEPLOY_URL}/"
          fetch "${DEPLOY_URL}/" home.html
          grep -q "<html" home.html

          # An SSG'd page: the only check that catches an unpopulated static
          # assets cache, which `dynamicParams = false` turns into a hard 404.
          echo "GET ${DEPLOY_URL}/en/evidence/${EVIDENCE_SLUG}"
          fetch "${DEPLOY_URL}/en/evidence/${EVIDENCE_SLUG}" evidence.html
          grep -q "<article" evidence.html

          # The evidence OG image, now a build-time static asset (#306). One
          # warmed-up fetch absorbs deploy propagation; after that, 6
          # cache-busted requests must ALL succeed with no retries —
          # `--retry-all-errors` is exactly how the exceededCpu failures of
          # #306 slipped past this test (a ~1-in-6 success rate almost always
          # survives 10 retries).
          echo "GET ${DEPLOY_URL}/og/evidence/${EVIDENCE_SLUG}.png"
          fetch "${DEPLOY_URL}/og/evidence/${EVIDENCE_SLUG}.png" og.png
          for i in 1 2 3 4 5 6; do
            curl --fail --silent --show-error --output og.png \
              "${DEPLOY_URL}/og/evidence/${EVIDENCE_SLUG}.png?cb=${RANDOM}${i}"
          done
          og_type=$(file -b og.png)
          case "$og_type" in
            "PNG image data"*) echo "OG image OK: $og_type" ;;
            *) echo "::error::The OG image is '${og_type}', not a PNG."; exit 1 ;;
          esac

          # The legacy OG URL lives on in already-scraped social cards; it
          # must 302 to the static file, not render anything. The Location is
          # asserted by suffix only: its host comes from the build-time
          # BASE_URL, which never matches a workers.dev DEPLOY_URL.
          echo "GET ${DEPLOY_URL}/api/og/evidence?slug=${EVIDENCE_SLUG}"
          read -r redirect_status redirect_location <<< "$(curl --silent --output /dev/null \
            --write-out "%{http_code} %{redirect_url}" \
            "${DEPLOY_URL}/api/og/evidence?slug=${EVIDENCE_SLUG}&cb=${RANDOM}")"
          if [ "$redirect_status" != "302" ]; then
            echo "::error::/api/og/evidence answered ${redirect_status}, expected 302."
            exit 1
          fi
          case "$redirect_location" in
            */og/evidence/"${EVIDENCE_SLUG}".png) echo "Redirect OK: $redirect_location" ;;
            *) echo "::error::/api/og/evidence redirects to '${redirect_location}', expected */og/evidence/${EVIDENCE_SLUG}.png."; exit 1 ;;
          esac

      # Only once the deploy step has actually run: a lint/test/variable-check
      # failure leaves nothing new to roll back from, and the instruction would
      # only mislead. (A failed deploy step still counts — the upload may have
      # gone through before the step errored.)
      - name: Rollback instructions
        if: failure() && steps.deploy.outcome != 'skipped'
        env:
          TARGET_ENV: ${{ needs.resolve.outputs.environment }}
        run: |
          echo "::error::Deploy to ${TARGET_ENV} failed. Roll back the last good version with: bunx wrangler rollback --env ${TARGET_ENV}"
