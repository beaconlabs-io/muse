name: Quality

# The push trigger looks redundant next to deploy-worker.yml's own lint/test
# re-run, but it is not: release PRs (dev → main) are opened by
# create-release-pr.yml with the workflow's GITHUB_TOKEN, and PRs created with
# that token never trigger pull_request workflows. The push run on dev/main is
# the only lint/test those refs get outside a deploy, and the only signal a
# release PR's reviewer has that the dev tip is green.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, dev]

# Superseded runs for the same PR (or branch) are pointless; cancel them.
concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Lint / Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint:check

      - name: Test
        run: bun run test:run

  preview:
    name: Build / Preview deploy
    # Push runs exist for lint/test only (see the trigger comment above); a
    # preview needs a PR to alias and comment on.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    env:
      HUSKY: "0"
      # The Worker build is also this PR's build check, so it runs even when the
      # preview upload below is skipped. Repository-level variables hold the
      # staging values (the production overrides live in the `production` GitHub
      # Environment, which this job deliberately does not join — a PR must not
      # appear in staging's deployment history). The fallbacks keep the build
      # working in a fork or clone with no variables configured.
      NEXT_PUBLIC_ENV: ${{ vars.NEXT_PUBLIC_ENV || 'development' }}
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL || 'https://example.invalid' }}
      NEXT_PUBLIC_EXTERNAL_SEARCH_ENABLED: ${{ vars.NEXT_PUBLIC_EXTERNAL_SEARCH_ENABLED }}
      # Forks receive no secrets, and the token may simply not be configured yet.
      # `secrets` cannot be read from an `if:`, so it is mapped to a flag here.
      HAS_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Builds the Worker rather than plain `next build`: it is the same
      # `next build` plus the OpenNext bundling step, so it catches Workers-only
      # breakage (unsupported middleware, bundle size) at PR time instead of on
      # the deploy that follows the merge.
      - name: Build Worker
        run: bun run build:worker

      # `versions upload` creates a new version of the staging Worker WITHOUT
      # shifting any traffic onto it, so open PRs never affect staging itself.
      # The alias is the PR number, not the branch name: branch names like
      # `feature/foo` contain characters that cannot appear in a DNS label.
      - name: Upload preview version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # wrangler appends machine-readable NDJSON records here — the
          # `version-upload` record carries both preview URLs — which survives
          # banner rewording, unlike scraping the log (and never fabricates an
          # alias by string surgery). The variable passes through to the
          # wrangler child process that opennextjs-cloudflare spawns.
          WRANGLER_OUTPUT_FILE_DIRECTORY: ${{ runner.temp }}/wrangler-output
        run: |
          if [ "$HAS_CLOUDFLARE_TOKEN" != "true" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not available (fork PR, or the secret is not configured) — skipping the preview upload. The build above still ran."
            exit 0
          fi

          bunx opennextjs-cloudflare upload -e staging -- --preview-alias "pr-${PR_NUMBER}"

          records=$(cat "$WRANGLER_OUTPUT_FILE_DIRECTORY"/*.json 2>/dev/null) || records=""
          # The version URL is unique per push; the aliased URL stays stable
          # across pushes to the same PR (the alias is the PR number: branch
          # names can hold characters a DNS label cannot).
          version_url=$(jq -r 'select(.type == "version-upload") | .preview_url // empty' <<< "$records" | tail -1) || version_url=""
          alias_url=$(jq -r 'select(.type == "version-upload") | .preview_alias_url // empty' <<< "$records" | tail -1) || alias_url=""

          if [ -z "$version_url" ]; then
            echo "::error::The upload succeeded but wrangler reported no preview URL."
            exit 1
          fi

          if [ -z "$alias_url" ]; then
            echo "::warning::wrangler reported no preview alias URL; the PR comment will carry only the per-commit URL."
          fi

          {
            echo "alias_url=$alias_url"
            echo "version_url=$version_url"
          } >> "$GITHUB_OUTPUT"

      # Upserted by header via .github/scripts/comment.js: react-doctor and
      # Claude Code Review comment under the same github-actions[bot] identity,
      # so `gh pr comment --edit-last` would edit whichever of them commented
      # last — overwriting a review — instead of this workflow's own comment.
      - name: Comment preview URLs on the PR
        if: steps.upload.outputs.version_url != ''
        uses: actions/github-script@v7
        env:
          ALIAS_URL: ${{ steps.upload.outputs.alias_url }}
          VERSION_URL: ${{ steps.upload.outputs.version_url }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const upsertComment = require("./.github/scripts/comment.js");
            const { ALIAS_URL, VERSION_URL, COMMIT_SHA } = process.env;
            const body = [
              "",
              "| | URL |",
              "| --- | --- |",
              ...(ALIAS_URL ? [`| この PR（push しても固定） | ${ALIAS_URL} |`] : []),
              `| このコミット | ${VERSION_URL} |`,
              "",
              "staging Worker (`muse-frontend-staging`) の**バージョン**としてアップロードされています。",
              "トラフィックは切り替わっていないため staging 本体には影響しません。",
              "",
              "バックエンド API 呼び出しは CORS で拒否されます（許可リストは完全一致で、プレビューの URL は毎回変わるため）。",
              "画面表示・ルーティング・SSG されたページの確認に使ってください。",
              "",
              `<sub>commit \`${COMMIT_SHA}\`</sub>`,
            ].join("\n");
            await upsertComment({ github, context, header: "### 🚀 プレビューデプロイ", body });
