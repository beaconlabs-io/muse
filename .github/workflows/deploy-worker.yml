name: Deploy Worker

# Deploys are merge-driven, not push-driven: only a merged PR into dev/main
# ships. A direct push to those branches deploys nothing — use the manual
# dispatch below if you ever need to ship something that did not arrive via PR.
on:
  pull_request:
    types: [closed]
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy the selected branch to
        type: choice
        options: [staging, production]
        required: true

concurrency:
  group: deploy-worker-${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.event.pull_request.base.ref == 'main' && 'production' || 'staging') }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # Closing a PR without merging also fires `closed`, so every job is gated on
  # the merge actually having happened.
  resolve:
    name: Resolve target
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.pick.outputs.environment }}
      ref: ${{ steps.pick.outputs.ref }}
    steps:
      - id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_ENV: ${{ inputs.environment }}
          DISPATCH_REF: ${{ github.ref_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            environment="$DISPATCH_ENV"
            ref="$DISPATCH_REF"
          elif [ "$BASE_REF" = "main" ]; then
            environment=production
            ref=main
          else
            environment=staging
            ref=dev
          fi
          {
            echo "environment=$environment"
            echo "ref=$ref"
          } >> "$GITHUB_OUTPUT"
          echo "Deploying branch '$ref' to '$environment'"

  deploy:
    name: Deploy ${{ needs.resolve.outputs.environment }}
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: write
    # GitHub Environments are used here for deployment history, the current URL
    # on the repo sidebar, and the production-only variable overrides described
    # below — not for approvals. A merged PR ships straight through by design;
    # the PR review is the gate.
    environment:
      name: ${{ needs.resolve.outputs.environment }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      # husky's `prepare` script has no hooks to install on a CI checkout.
      HUSKY: "0"
      # Every value this app reads at runtime is a NEXT_PUBLIC_* string inlined
      # into the bundle by `next build`, so the environment split happens here,
      # at build time, not in wrangler.jsonc. Repository-level variables carry
      # the staging values; the `production` GitHub Environment overrides them.
      # `NEXT_PUBLIC_ENV` differs between the two, so the check below catches a
      # missing production override instead of shipping staging config to prod.
      NEXT_PUBLIC_ENV: ${{ vars.NEXT_PUBLIC_ENV }}
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
      NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ vars.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID }}
      NEXT_PUBLIC_EXTERNAL_SEARCH_ENABLED: ${{ vars.NEXT_PUBLIC_EXTERNAL_SEARCH_ENABLED }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - run: bun install --frozen-lockfile

      # The checks a PR passes, re-run against the merged branch so nothing
      # reaches an environment without passing them. The build is not repeated:
      # `build:worker` below is the same `next build`, against the code that
      # actually ships.
      - run: bun run lint:check

      - run: bun run test:run

      # An unset NEXT_PUBLIC_* does not fail the build — it inlines an empty
      # string and produces a Worker that renders but calls same-origin routes
      # this app no longer serves. Fail here instead, where the cause is legible.
      - name: Check build variables
        env:
          TARGET_ENV: ${{ needs.resolve.outputs.environment }}
        run: |
          missing=()
          for name in NEXT_PUBLIC_ENV NEXT_PUBLIC_API_BASE_URL NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing GitHub variables for '${TARGET_ENV}': ${missing[*]}. Set them as repository variables (staging values) or in the '${TARGET_ENV}' environment."
            exit 1
          fi

          # configs/eas.ts and lib/constants.ts switch chain endpoints and the
          # canonical base URL on this value, so it is the one variable that
          # must differ between the two environments.
          case "$TARGET_ENV" in
            production) expected=production ;;
            *) expected=development ;;
          esac
          if [ "$NEXT_PUBLIC_ENV" != "$expected" ]; then
            echo "::error::NEXT_PUBLIC_ENV is '${NEXT_PUBLIC_ENV}' but a ${TARGET_ENV} deploy expects '${expected}'. The '${TARGET_ENV}' environment is probably missing its variable overrides."
            exit 1
          fi

      - name: Build Worker
        id: build
        run: |
          bun run build:worker

          # Prerendered pages land in .open-next/cache/<BUILD_ID>/, not in the
          # assets directory, and only `opennextjs-cloudflare deploy` uploads
          # them. Pick one to smoke-test with, read from the build output rather
          # than hardcoded, so it cannot rot when the evidence package changes.
          page=$(find .open-next/cache -path '*/en/evidence/*.cache' -print -quit 2>/dev/null) || true
          if [ -z "$page" ]; then
            echo "::error::No prerendered evidence page in .open-next/cache — generateStaticParams produced nothing, so the smoke test below cannot verify the cache upload."
            exit 1
          fi
          slug=$(basename "$page" .cache)
          echo "evidence_slug=$slug" >> "$GITHUB_OUTPUT"
          echo "Smoke test will use evidence slug '$slug'"

      # Deploying through `opennextjs-cloudflare`, not `wrangler deploy`, is
      # load-bearing: only this path uploads the prerendered pages into the
      # static assets cache. A plain `wrangler deploy` leaves every evidence
      # page 404ing while the rest of the site looks healthy.
      - name: Deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TARGET_ENV: ${{ needs.resolve.outputs.environment }}
        run: |
          bunx opennextjs-cloudflare deploy -e "$TARGET_ENV" 2>&1 | tee deploy.log

          # Colour codes would cut the URL short mid-match, so strip them first.
          sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g' deploy.log > deploy.txt
          url=$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.txt | tail -1) || true
          if [ -z "$url" ]; then
            echo "::error::The deploy succeeded but no workers.dev URL was found in its output, so the smoke test cannot run. Verify the deployment manually."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"

      - name: Smoke test
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          EVIDENCE_SLUG: ${{ steps.build.outputs.evidence_slug }}
        run: |
          # A freshly deployed workers.dev URL can 404 for tens of seconds, so
          # every request retries before the deploy is called bad.
          fetch() {
            curl --fail --silent --show-error --location \
              --retry 10 --retry-delay 6 --retry-all-errors \
              --output "$2" "$1"
          }

          # `/` exercises the locale redirects that replaced the next-intl proxy.
          echo "GET ${DEPLOY_URL}/"
          fetch "${DEPLOY_URL}/" home.html
          grep -q "<html" home.html

          # An SSG'd page: the only check that catches an unpopulated static
          # assets cache, which `dynamicParams = false` turns into a hard 404.
          echo "GET ${DEPLOY_URL}/en/evidence/${EVIDENCE_SLUG}"
          fetch "${DEPLOY_URL}/en/evidence/${EVIDENCE_SLUG}" evidence.html
          grep -q "<article" evidence.html

          # The only server-rendered route left in this app, and the one that
          # depends on the separately uploaded resvg WASM module. It renders a
          # logo fetched from lib/constants.ts's BASE_URL, so this also fails if
          # that host is unreachable.
          echo "GET ${DEPLOY_URL}/api/og/evidence?slug=${EVIDENCE_SLUG}"
          fetch "${DEPLOY_URL}/api/og/evidence?slug=${EVIDENCE_SLUG}" og.png
          og_type=$(file -b og.png)
          case "$og_type" in
            "PNG image data"*) echo "OG image OK: $og_type" ;;
            *) echo "::error::The OG route answered with '${og_type}', not a PNG."; exit 1 ;;
          esac

      - name: Rollback instructions
        if: failure()
        env:
          TARGET_ENV: ${{ needs.resolve.outputs.environment }}
        run: |
          echo "::error::Deploy to ${TARGET_ENV} failed. Roll back the last good version with: bunx wrangler rollback --env ${TARGET_ENV}"
