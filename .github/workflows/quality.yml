name: Quality

# Pull requests only. The push trigger for main/dev was dropped when
# deploy-worker.yml landed: every merge into those branches now re-runs lint and
# tests before it deploys, and a push-triggered copy would only duplicate a
# multi-minute Next.js build on the same commit.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Superseded runs for the same PR are pointless; cancel them.
concurrency:
  group: quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Lint / Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint:check

      - name: Test
        run: bun run test:run

  preview:
    name: Build / Preview deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    env:
      HUSKY: "0"
      # The Worker build is also this PR's build check, so it runs even when the
      # preview upload below is skipped. Repository-level variables hold the
      # staging values (the production overrides live in the `production` GitHub
      # Environment, which this job deliberately does not join — a PR must not
      # appear in staging's deployment history). The fallbacks keep the build
      # working in a fork or clone with no variables configured.
      NEXT_PUBLIC_ENV: ${{ vars.NEXT_PUBLIC_ENV || 'development' }}
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL || 'https://example.invalid' }}
      NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ vars.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID || 'test' }}
      NEXT_PUBLIC_EXTERNAL_SEARCH_ENABLED: ${{ vars.NEXT_PUBLIC_EXTERNAL_SEARCH_ENABLED }}
      # Forks receive no secrets, and the token may simply not be configured yet.
      # `secrets` cannot be read from an `if:`, so it is mapped to a flag here.
      HAS_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Builds the Worker rather than plain `next build`: it is the same
      # `next build` plus the OpenNext bundling step, so it catches Workers-only
      # breakage (unsupported middleware, bundle size) at PR time instead of on
      # the deploy that follows the merge.
      - name: Build Worker
        run: bun run build:worker

      # `versions upload` creates a new version of the staging Worker WITHOUT
      # shifting any traffic onto it, so open PRs never affect staging itself.
      # The alias is the PR number, not the branch name: branch names like
      # `feature/foo` contain characters that cannot appear in a DNS label.
      - name: Upload preview version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$HAS_CLOUDFLARE_TOKEN" != "true" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not available (fork PR, or the secret is not configured) — skipping the preview upload. The build above still ran."
            exit 0
          fi

          bunx opennextjs-cloudflare upload -e staging -- --preview-alias "pr-${PR_NUMBER}" 2>&1 | tee upload.log

          # The version URL is https://<version-prefix>-<worker>.<subdomain>.workers.dev
          # and is unique per push; the aliased URL stays stable across pushes to
          # the same PR. Prefer the alias wrangler prints, and derive it from the
          # version URL otherwise so the Worker name is never duplicated here.
          # Colour codes would cut a URL short mid-match, so strip them first.
          sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g' upload.log > upload.txt
          alias_url=$(grep -Eo "https://pr-${PR_NUMBER}-[A-Za-z0-9.-]+\.workers\.dev" upload.txt | tail -1) || true
          version_url=$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' upload.txt | grep -v "^https://pr-${PR_NUMBER}-" | tail -1) || true

          if [ -z "$version_url" ]; then
            echo "::error::The upload succeeded but no workers.dev URL was found in its output."
            exit 1
          fi

          if [ -z "$alias_url" ]; then
            host=${version_url#https://}
            label=${host%%.*}          # <version-prefix>-<worker>
            subdomain=${host#*.}       # <subdomain>.workers.dev
            alias_url="https://pr-${PR_NUMBER}-${label#*-}.${subdomain}"
          fi

          {
            echo "alias_url=$alias_url"
            echo "version_url=$version_url"
          } >> "$GITHUB_OUTPUT"

      - name: Comment preview URLs on the PR
        if: steps.upload.outputs.alias_url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ALIAS_URL: ${{ steps.upload.outputs.alias_url }}
          VERSION_URL: ${{ steps.upload.outputs.version_url }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          body=$(cat <<EOF
          ### 🚀 プレビューデプロイ

          | | URL |
          | --- | --- |
          | この PR（push しても固定） | ${ALIAS_URL} |
          | このコミット | ${VERSION_URL} |

          staging Worker (\`muse-frontend-staging\`) の**バージョン**としてアップロードされています。
          トラフィックは切り替わっていないため staging 本体には影響しません。

          バックエンド API 呼び出しは CORS で拒否されます（許可リストは完全一致で、プレビューの URL は毎回変わるため）。
          画面表示・ルーティング・SSG されたページの確認に使ってください。

          <sub>commit \`${COMMIT_SHA}\`</sub>
          EOF
          )
          gh pr comment "$PR_NUMBER" --edit-last --create-if-none --body "$body"
